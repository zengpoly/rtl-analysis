<section class="module-v2-section" id="key-rtl"><header class="section-heading"><h2>推荐优先阅读的 RTL</h2><span>精选入口，不替代完整 Source Evidence</span></header><ol class="key-rtl-list">{% for item in view.key_rtl %}<li><div><strong>{{ item.why }}</strong><code>{{ item.path }}:{{ item.fragment }}</code></div>{% if item.source_entity_id in page_map %}<a href="{{ href(page_map[item.source_entity_id], item.fragment) }}">打开源码</a>{% else %}<span class="locator-only">locator only</span>{% endif %}<span class="support-label">{{ item.support_label }}</span></li>{% endfor %}</ol></section>
